## Spring DATASOURCE (DataSourceAutoConfiguration & DataSourceProperties)
# Environment variable override or .env file recommended for all DB connection info.
# For local Compose: DB_HOST=db, DB_PORT=3002 (Postgres in container on port 3002, mapped from 5432)
# For Preview/CI: DB_HOST=localhost, DB_PORT=3002 (external port mapped by system)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:3002}/${DB_NAME:postgres_demo}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# The SQL dialect makes Hibernate generate better SQL for the chosen database
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto=update
