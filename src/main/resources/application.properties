## Spring DATASOURCE (DataSourceAutoConfiguration & DataSourceProperties)
# All DB connection info is configurable via environment variable (.env or Compose env block).
# For Compose: set DB_HOST=db (from service name), DB_PORT=3002. For local preview/CI use DB_HOST=localhost, DB_PORT=3002.
# PUBLIC_INTERFACE
# Spring Boot PostgreSQL datasource configuration.
# DB container exposed on port 3002.
# Environment overrides are available for local/preview/CI/Docker Compose.

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:3002}/${DB_NAME:postgres_demo}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# The SQL dialect makes Hibernate generate better SQL for the chosen database
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto=update

# Confirmed: No lingering db_visualizer references and config consistent with Docker services.
