## Spring DATASOURCE (DataSourceAutoConfiguration & DataSourceProperties)
# Datasource URL is hardcoded for local development/PostgreSQL container (never use env overrides)
# For this configuration, SSL is forcibly disabled via 'sslmode=disable' in the JDBC URL
# GSS is also disabled for local/dev connections
spring.datasource.url=jdbc:postgresql://localhost:3020/postgres?sslmode=disable
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate: correct dialect for PostgreSQL with Spring Boot 2.5.x (Hibernate 5.4.x)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Never auto-init schema from resources
spring.sql.init.mode=never

# HikariCP pool settings for startup resilience
spring.datasource.hikari.connectionTimeout=20000
spring.datasource.hikari.maximumPoolSize=5
spring.datasource.hikari.connectionTestQuery=SELECT 1
spring.datasource.hikari.initializationFailTimeout=0
spring.datasource.hikari.data-source-properties.sslmode=disable
