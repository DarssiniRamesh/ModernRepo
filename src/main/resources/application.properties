## Spring DATASOURCE (DataSourceAutoConfiguration & DataSourceProperties)
#
# Datasource URL is built from env (SPRING_DATASOURCE_HOST, PORT, etc) and defaults to localhost:3020;
# No reference to 'postgres-db' may remain: host=localhost, port=3020 is always used unless explicitly set.
# Added `?sslmode=disable` to JDBC default for local (override with env DB_URL if needed)
spring.datasource.url=${DB_URL:jdbc:postgresql://${SPRING_DATASOURCE_HOST:localhost}:${SPRING_DATASOURCE_PORT:3020}/${SPRING_DATASOURCE_DB:modernrepo}?sslmode=disable}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate: correct dialect for PostgreSQL with Spring Boot 2.5.x (Hibernate 5.4.x)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Never auto-init schema from resources
spring.sql.init.mode=never

# HikariCP pool settings for startup resilience
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connectionTestQuery=SELECT 1
spring.datasource.hikari.initializationFailTimeout=0
spring.datasource.hikari.data-source-properties.sslmode=disable
spring.datasource.hikari.data-source-properties.ssl=false
