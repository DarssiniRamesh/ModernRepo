# Test profile: strictly match the main and dev properties - force correct URL, credentials, SSL/hikari config.
spring.datasource.url=jdbc:postgresql://localhost:3020/postgres?sslmode=disable
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.sql.init.mode=never

spring.datasource.hikari.maximumPoolSize=2
spring.datasource.hikari.minimumIdle=1
spring.datasource.hikari.connectionTimeout=30000
spring.datasource.hikari.validationTimeout=10000
spring.datasource.hikari.idleTimeout=60000
spring.datasource.hikari.maxLifetime=180000
spring.datasource.hikari.connectionTestQuery=SELECT 1
spring.datasource.hikari.initializationFailTimeout=0
spring.datasource.hikari.data-source-properties.sslmode=disable
