#
# Base Spring Boot application properties
#
# Profile selection is controlled ONLY by SPRING_PROFILES_ACTIVE environment variable.
# No default profile is set here to prevent unintended dev (H2) launches.
# Options: prod (PostgreSQL, recommended for production), dev (H2 in-memory)
#
# The launcher (.kavia-start.json, start.sh) sets SPRING_PROFILES_ACTIVE=prod by default.
# To use dev profile locally: export SPRING_PROFILES_ACTIVE=dev before running.
#

# JPA/Hibernate DDL auto option (see profile-specific overrides below)
spring.jpa.hibernate.ddl-auto=update

# Graceful shutdown - applies to all profiles
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Application name
spring.application.name=ModernRepo

# Actuator management endpoints - base configuration
management.endpoints.web.base-path=/actuator
management.endpoint.health.probes.enabled=true

# Springdoc OpenAPI configuration
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.use-root-path=true
springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config
springdoc.swagger-ui.url=/v3/api-docs

# Forward headers strategy for proxy/preview environments
server.forward-headers-strategy=framework

# Tomcat remote IP configuration for X-Forwarded headers
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.protocol-header=x-forwarded-proto

#
# For DB connection properties, see profile-specific files:
#   application-dev.properties: H2 in-memory config for development
#   application-prod.properties: PostgreSQL config for production, all properties driven by environment variables
#
