#
# Base Spring Boot application properties
#
# Selects the DB profile. Options: dev (H2 in-memory), prod (PostgreSQL, recommended for production)
#
# To override: use SPRING_PROFILES_ACTIVE environment variable, e.g.:
#   SPRING_PROFILES_ACTIVE=prod for PostgreSQL, SPRING_PROFILES_ACTIVE=dev for H2 (default if not set)
#
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JPA/Hibernate DDL auto option (see profile-specific overrides below)
spring.jpa.hibernate.ddl-auto=update

# Graceful shutdown - applies to all profiles
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Application name
spring.application.name=ModernRepo

# Actuator management endpoints - base configuration
management.endpoints.web.base-path=/actuator
management.endpoint.health.probes.enabled=true

# Springdoc OpenAPI configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true

#
# For DB connection properties, see profile-specific files:
#   application-dev.properties: H2 in-memory config for development
#   application-prod.properties: PostgreSQL config for production, all properties driven by environment variables
#
