#
# Base Spring Boot application properties
#
# Server port (can be overridden by --server.port or PORT environment variable)
server.port=${PORT:3001}

# Forward headers strategy to respect proxy headers (X-Forwarded-* headers)
server.forward-headers-strategy=framework
server.use-forward-headers=true

# Selects the DB profile. Options: dev (H2 in-memory), prod (PostgreSQL, recommended for production)
#
# To override: use SPRING_PROFILES_ACTIVE environment variable, e.g.:
#   SPRING_PROFILES_ACTIVE=prod for PostgreSQL, SPRING_PROFILES_ACTIVE=dev for H2 (default if not set)
#
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# springdoc-openapi Swagger UI configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

# Swagger UI configuration - disable default URL to force use of configured servers
springdoc.swagger-ui.disable-swagger-default-url=true

# JPA/Hibernate DDL auto option (see profile-specific overrides below)
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in console for debugging (disable in production)
spring.jpa.show-sql=false

#
# For DB connection properties, see profile-specific files:
#   application-dev.properties: H2 in-memory config for development
#   application-prod.properties: PostgreSQL config for production, all properties driven by environment variables
#
# If you want to connect to a real PostgreSQL, set the following environment variables (see prod profile):
#   SPRING_DATASOURCE_URL
#   SPRING_DATASOURCE_USERNAME
#   SPRING_DATASOURCE_PASSWORD
#
# See Readme.md for more details.
#
