#
# Base Spring Boot application properties
#
# Selects the DB profile. Options:
#   - dev (default): H2 in-memory for local development
#   - prod: PostgreSQL (defaults to container 'postgres-db'; can be overridden via env vars)
#
# To override: use SPRING_PROFILES_ACTIVE environment variable, e.g.:
#   SPRING_PROFILES_ACTIVE=prod for PostgreSQL, SPRING_PROFILES_ACTIVE=dev for H2 (default if not set)
#
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}   # Default to dev; override via environment variable.

# Server binding: default to 3000, allow override via PORT env var (common in container platforms)
server.port=${PORT:3000}
server.address=0.0.0.0

# JPA/Hibernate DDL auto option. Can be overridden via SPRING_JPA_HIBERNATE_DDL_AUTO.
# Note: profile-specific files may override this (prod uses ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}).
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

#
# For DB connection properties, see profile-specific files:
#   application-dev.properties: H2 in-memory config for development
#   application-prod.properties: PostgreSQL config for production (prefers env var overrides)
#
#
# If you want to connect to a real PostgreSQL, set the following environment variables (see prod profile):
#   SPRING_DATASOURCE_URL (e.g., jdbc:postgresql://postgres-db:5432/modernrepo or jdbc:postgresql://localhost:5000/modernrepo)
#   SPRING_DATASOURCE_USERNAME=modernuser
#   SPRING_DATASOURCE_PASSWORD=modernpass
#   SPRING_JPA_HIBERNATE_DDL_AUTO (optional; update|validate|create|create-drop)
#
# OpenAPI exposure settings
springdoc.api-docs.path=/openapi.json
springdoc.swagger-ui.path=/docs
