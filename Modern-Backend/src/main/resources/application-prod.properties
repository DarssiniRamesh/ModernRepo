#
# Production profile: PostgreSQL. All connection info should be set via environment variables (see below).
#
# Database connection URL constructed from individual environment variables
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:myapp}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:appuser}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:dbuser123}}
spring.datasource.driver-class-name=org.postgresql.Driver

# PostgreSQL Hibernate dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# DDL auto: update (safe for most apps, can be overridden by SPRING_JPA_HIBERNATE_DDL_AUTO)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

# Hikari Connection Pool Configuration (default pool for Spring Boot 2.x+)
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=60000

# Graceful shutdown configuration to handle SIGTERM properly
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Actuator configuration for health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true
management.health.defaults.enabled=true

# Server configuration
server.port=${SERVER_PORT:${PORT:3001}}
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain

# Forward headers strategy for proxy/preview environments
server.forward-headers-strategy=framework

# Tomcat remote IP configuration for X-Forwarded headers
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.protocol-header=x-forwarded-proto

# Springdoc configuration for production
springdoc.api-docs.enabled=true
springdoc.swagger-ui.use-root-path=true
springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config
springdoc.swagger-ui.url=/v3/api-docs

#
# To run with PostgreSQL, set (as environment variables or command line properties):
#   SPRING_PROFILES_ACTIVE=prod
#   SPRING_DATASOURCE_URL (or POSTGRES_HOST, POSTGRES_PORT, POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD)
#   SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
# 
# Defaults if not set:
#   POSTGRES_HOST=localhost
#   POSTGRES_PORT=5432
#   POSTGRES_DB=myapp
#   POSTGRES_USER=appuser
#   POSTGRES_PASSWORD=dbuser123
#
