#
# Production profile: PostgreSQL. All connection info can be set via environment variables (preferred).
#
# Default to the in-network container name `postgres-db` with fallback to localhost:5000 if exposed via host port.
# You can always override with SPRING_DATASOURCE_URL.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-db:5432/modernrepo}
# Alternative local example (host port mapping 5000->5432):
# SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5000/modernrepo
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:modernuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:modernpass}
spring.datasource.driver-class-name=org.postgresql.Driver

# PostgreSQL Hibernate dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# DDL auto: update (safe default). Override with SPRING_JPA_HIBERNATE_DDL_AUTO (e.g., validate if using migrations).
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

#
# To run with PostgreSQL, set (as environment variables or command line properties):
#   SPRING_PROFILES_ACTIVE=prod
#   SPRING_DATASOURCE_URL (optional if using defaults above)
#   SPRING_DATASOURCE_USERNAME
#   SPRING_DATASOURCE_PASSWORD
#   SPRING_JPA_HIBERNATE_DDL_AUTO (optional; default is 'update')
#
