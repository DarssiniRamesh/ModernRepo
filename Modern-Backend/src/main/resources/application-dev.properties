#
# Development profile: in-memory H2 database
#
spring.datasource.url=jdbc:h2:mem:devdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Enable H2 console for development
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Graceful shutdown configuration
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Actuator configuration for health checks
management.endpoints.web.exposure.include=health,info,env
management.endpoint.health.show-details=always
management.health.db.enabled=true
management.health.defaults.enabled=true

# Server configuration
server.port=${SERVER_PORT:${PORT:3001}}

# Forward headers strategy for proxy/preview environments
server.forward-headers-strategy=framework

# Tomcat remote IP configuration for X-Forwarded headers
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.protocol-header=x-forwarded-proto

# OpenAPI server URL override
openapi.server.url=${OPENAPI_SERVER_URL:http://localhost:${server.port}}

# Springdoc configuration for development
springdoc.api-docs.enabled=true
springdoc.swagger-ui.use-root-path=true
springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config
# Explicitly set the URL to prevent fallback to Petstore
springdoc.swagger-ui.url=/v3/api-docs
