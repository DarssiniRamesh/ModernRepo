#
# Production profile: PostgreSQL. All connection info should be set via environment variables (see below).
#
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres_demo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# PostgreSQL Hibernate dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# DDL auto: update (safe for most apps, can be overridden by SPRING_JPA_HIBERNATE_DDL_AUTO)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

#
# To run with PostgreSQL, set (as environment variables or command line properties):
#   SPRING_PROFILES_ACTIVE=prod
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
# If these are not set, will use defaults above.
#
