## Spring DATASOURCE (DataSourceAutoConfiguration & DataSourceProperties)

# Datasource URL supports env vars, defaulting to local Postgres exposed at 3020
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:3020}/${DB_NAME:modernrepo}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate: correct dialect for PostgreSQL with Spring Boot 2.5.x (Hibernate 5.4.x)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Never auto-init schema from resources
spring.sql.init.mode=never

# HikariCP pool settings for startup resilience
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
