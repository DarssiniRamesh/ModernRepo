## Spring DATASOURCE (DataSourceAutoConfiguration & DataSourceProperties)
# Verified: Datasource URL and credentials for local Postgres.
# Do not override with environment. All config is hardcoded for container environment consistency.

# Make sure the port (3020) and host (localhost) really match the running postgres-db service.
spring.datasource.url=jdbc:postgresql://localhost:3020/postgres?sslmode=disable

# User/pass must match the running postgres-db container config.
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate: correct dialect for PostgreSQL with Spring Boot 2.5.x (Hibernate 5.4.x)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Never auto-init schema from resources
spring.sql.init.mode=never

# HikariCP pool settings for startup resilience. POOL SIZE REDUCED, TIMEOUTS INCREASED PER TUNING INSTRUCTION.
spring.datasource.hikari.maximumPoolSize=2
spring.datasource.hikari.minimumIdle=1
spring.datasource.hikari.connectionTimeout=30000
spring.datasource.hikari.validationTimeout=10000
spring.datasource.hikari.idleTimeout=60000
spring.datasource.hikari.maxLifetime=180000
spring.datasource.hikari.connectionTestQuery=SELECT 1
spring.datasource.hikari.initializationFailTimeout=0
# Explicitly, ensure Hikari will not try to use SSL or other non-local flags:
spring.datasource.hikari.data-source-properties.sslmode=disable
# Remove any legacy or conflicting SSL options from below.

# (Recommended: if still problems, try setting socketTimeout=30 as backup)
# spring.datasource.hikari.data-source-properties.socketTimeout=30
