## Dev profile: datasource configuration matches defaults (localhost:3020 unless overridden)
#
# Use SPRING_DATASOURCE_HOST/PORT/DB for env overrides; no reference to 'postgres-db'.
# Added `?sslmode=disable` to JDBC default for dev profile to prevent SSL-required issues with local Postgres
# Dev profile: force localhost:3020, SSL off, GSS off, never reference 'postgres-db', override with DB_URL env var if needed
spring.datasource.url=${DB_URL:jdbc:postgresql://${SPRING_DATASOURCE_HOST:localhost}:${SPRING_DATASOURCE_PORT:3020}/${SPRING_DATASOURCE_DB:modernrepo}?sslmode=disable&gssEncMode=disable}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.sql.init.mode=never

spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connectionTestQuery=SELECT 1
spring.datasource.hikari.initializationFailTimeout=0
spring.datasource.hikari.data-source-properties.sslmode=disable
